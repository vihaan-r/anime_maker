name: XLINE Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/xline/**'
      - '.github/workflows/xline-benchmark.yml'
      - 'docs/XLINE_RESEARCH.md'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/xline/requirements.txt

      - name: Run XLINE benchmark (5 models)
        run: |
          python scripts/xline/benchmark.py --output-dir artifacts

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xline-benchmark-artifacts
          path: |
            artifacts/xline_benchmark_results.csv
            artifacts/xline_benchmark_results.json
            artifacts/screenshots/*.png
